apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: k8s-practice
  region: ap-northeast-2
  tags:
    project: k8s-practice
    environment: practice

vpc:
  nat:
    # 실습 비용을 줄인 단일 NAT다. AZ 장애까지 견디려면 비용을 확인하고 HighlyAvailable로 바꾼다.
    gateway: Single

managedNodeGroups:
  - name: workers
    instanceType: t3.medium
    desiredCapacity: 3
    minSize: 3
    maxSize: 6
    privateNetworking: true
    labels:
      workload: application
    updateConfig:
      maxUnavailable: 1

cloudWatch:
  clusterLogging:
    enableTypes:
      - api
      - audit
      - authenticator
      - controllerManager
      - scheduler
