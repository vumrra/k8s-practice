grafana:
  adminPassword: practice-only-change-me
  persistence:
    enabled: false

prometheus:
  prometheusSpec:
    retention: 2d
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
